services:
  app:
    build:
      context: .
      target: dependencies
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://petora:petora_dev@db:5432/petora
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: npm run dev -- --hostname 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petora
      POSTGRES_USER: petora
      POSTGRES_PASSWORD: petora_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petora -d petora"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: petora_test
      POSTGRES_USER: petora
      POSTGRES_PASSWORD: petora_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petora -d petora_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_node_modules:
  app_next:
  postgres_data:
  postgres_test_data:
