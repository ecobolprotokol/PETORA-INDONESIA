name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: petora_test
          POSTGRES_USER: petora
          POSTGRES_PASSWORD: petora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petora -d petora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://petora:petora_test@localhost:5432/petora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
